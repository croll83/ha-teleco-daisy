slats_jog:
  name: Lamelle - micro-passi (jog)
  description: Regolazione fine dell'angolo lamelle a passi contati (frame radio singoli).
  target:
    entity:
      domain: cover
  fields:
    direction:
      name: Direzione
      required: true
      selector:
        select:
          options: ["open", "close"]
    count:
      name: Numero passi
      default: 1
      selector:
        number: {min: 1, max: 40}
    spacing:
      name: Secondi tra i passi
      default: 1
      selector:
        number: {min: 0.3, max: 10, step: 0.1}
